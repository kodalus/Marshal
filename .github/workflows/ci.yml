name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  rdzen:
    name: Rdzeń — budowanie i testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wzorce .gitignore
        run: ./tools/check-gitignore.sh

      - name: Cudzysłowy w napisach
        run: ./tools/check-quotes.sh

      - name: Odtworzenie pakietów
        run: |
          dotnet restore src/Marshal.Desktop/Marshal.Desktop.csproj
          dotnet restore tests/Marshal.Tests/Marshal.Tests.csproj

      - name: Budowanie
        run: |
          dotnet build src/Marshal.Desktop/Marshal.Desktop.csproj -c Release --no-restore
          dotnet build tests/Marshal.Tests/Marshal.Tests.csproj -c Release --no-restore

      - name: Testy
        run: dotnet test tests/Marshal.Tests/Marshal.Tests.csproj -c Release --no-build --logger "trx;LogFileName=wyniki.trx" --results-directory artefakty/testy

      - name: Migracje zgodne z modelem
        run: |
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes \
            -p src/Marshal.Infrastructure \
            -s src/Marshal.Infrastructure

      - name: Wyniki testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyniki-testow
          path: artefakty/testy
          if-no-files-found: ignore

  android:
    name: Android — budowanie
    runs-on: ubuntu-latest

    # Zapis do wydań, żeby APK dał się pobrać wprost na telefon. Reszta przebiegu
    # niczego nie zapisuje, więc uprawnienie jest tu wąskie z rozmysłu.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Workload Androida
        run: dotnet workload install android

      # Podpis stałym kluczem, jeśli jest w sekretach repozytorium.
      #
      # Bez niego każdy przebieg podpisuje APK **świeżym kluczem domyślnym**, bo
      # bieżnia CI startuje za każdym razem od zera. Android nie pozwala nadpisać
      # aplikacji pakietem o innym podpisie i odmawia komunikatem „konflikt
      # z istniejącym pakietem" — czyli każda aktualizacja wymaga odinstalowania,
      # a to kasuje bazę.
      #
      # Klucz nie może leżeć w repozytorium, bo jest publiczne, a kto ma klucz, ten
      # może wypuścić aktualizację Marshala dla każdego, kto go ma. Sekrety są tu
      # jedynym sensownym miejscem. Instrukcja: docs/android-podpis.md.
      - name: Klucz podpisujący
        id: klucz
        env:
          SKARBIEC: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$SKARBIEC" ]; then
            echo "$SKARBIEC" | base64 -d > "$RUNNER_TEMP/marshal.keystore"
            echo "jest=tak" >> "$GITHUB_OUTPUT"
          else
            echo "jest=nie" >> "$GITHUB_OUTPUT"
            echo "::warning::Brak sekretu ANDROID_KEYSTORE — APK podpisany kluczem domyślnym, więc nie nadpisze poprzedniej instalacji."
          fi

      - name: Publikacja APK (klucz stały)
        if: steps.klucz.outputs.jest == 'tak'
        env:
          HASLO: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dotnet publish src/Marshal.Android/Marshal.Android.csproj -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/marshal.keystore" \
            -p:AndroidSigningStorePass="$HASLO" \
            -p:AndroidSigningKeyAlias=marshal \
            -p:AndroidSigningKeyPass="$HASLO"

      - name: Publikacja APK (klucz domyślny)
        if: steps.klucz.outputs.jest != 'tak'
        run: dotnet publish src/Marshal.Android/Marshal.Android.csproj -c Release

      - name: Zebranie pakietów
        run: |
          mkdir -p artefakty/apk
          find src/Marshal.Android/bin/Release -name '*.apk' -exec cp {} artefakty/apk/ \;
          ls -l artefakty/apk

      # Suma kontrolna w dzienniku przebiegu. Po to, żeby dało się sprawdzić, czy plik,
      # który doszedł na telefon, jest tym, który tu powstał — a nie żeby uspokajać.
      # To jedyna rzecz, którą da się o pliku stwierdzić z zewnątrz bez zaufania komukolwiek.
      - name: Suma kontrolna
        id: suma
        run: |
          SUMA=$(sha256sum artefakty/apk/*.apk | awk '{print $1}')
          echo "sha=$SUMA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SUMA"

      - name: APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: marshal-apk
          path: artefakty/apk
          if-no-files-found: error

      # Drugie miejsce na ten sam plik, i to ono jest właściwą drogą na telefon.
      #
      # Artefakt przebiegu przychodzi **zapakowany w ZIP i tylko po zalogowaniu**, więc
      # trzeba go pobrać na komputerze i przełożyć. Windows widzi wtedy świeżo zbudowany,
      # nigdy wcześniej niewidziany plik wykonywalny w archiwum i blokuje go po reputacji,
      # a nie po zawartości — komunikatem o wirusie, którego nikt nie znalazł.
      #
      # Wydanie to pojedynczy plik pod stałym adresem, bez logowania i bez archiwum.
      # Telefon pobiera go sam i Windows nie ma w tym żadnego udziału.
      #
      # Ruchoma etykieta „najnowsza": nie wersjonujemy jeszcze wydań, a dwadzieścia wydań
      # dziennie byłoby listą, z której nic nie wynika. Numer wersji w opisie mówi, z czego
      # powstało.
      - name: Wydanie do pobrania
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMA: ${{ steps.suma.outputs.sha }}
        run: |
          OPIS=$(printf 'Budowanie z %s\n\nSHA-256: `%s`\n\nPlik pobrany na telefon powinien mieć tę samą sumę.' "$GITHUB_SHA" "$SUMA")

          if gh release view najnowsza >/dev/null 2>&1; then
            gh release upload najnowsza artefakty/apk/*.apk --clobber
            gh release edit najnowsza --notes "$OPIS"
          else
            gh release create najnowsza artefakty/apk/*.apk \
              --title "Marshal — najnowsze budowanie" \
              --notes "$OPIS"
          fi
