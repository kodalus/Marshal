name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  rdzen:
    name: Rdzeń — budowanie i testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wzorce .gitignore
        run: ./tools/check-gitignore.sh

      - name: Odtworzenie pakietów
        run: |
          dotnet restore src/Marshal.Desktop/Marshal.Desktop.csproj
          dotnet restore tests/Marshal.Tests/Marshal.Tests.csproj

      - name: Budowanie
        run: |
          dotnet build src/Marshal.Desktop/Marshal.Desktop.csproj -c Release --no-restore
          dotnet build tests/Marshal.Tests/Marshal.Tests.csproj -c Release --no-restore

      - name: Testy
        run: dotnet test tests/Marshal.Tests/Marshal.Tests.csproj -c Release --no-build --logger "trx;LogFileName=wyniki.trx" --results-directory artefakty/testy

      - name: Wyniki testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyniki-testow
          path: artefakty/testy
          if-no-files-found: ignore

  android:
    name: Android — budowanie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Workload Androida
        run: dotnet workload install android

      - name: Publikacja APK
        run: dotnet publish src/Marshal.Android/Marshal.Android.csproj -c Release

      - name: Zebranie pakietów
        run: |
          mkdir -p artefakty/apk
          find src/Marshal.Android/bin/Release -name '*.apk' -exec cp {} artefakty/apk/ \;
          ls -l artefakty/apk

      - name: APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: marshal-apk
          path: artefakty/apk
          if-no-files-found: error

  migracja:
    name: Migracja — wygenerowanie do wglądu (tymczasowe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Narzędzie dotnet-ef
        run: dotnet tool install --global dotnet-ef
      - name: Odtworzenie pakietów
        run: dotnet restore src/Marshal.Infrastructure/Marshal.Infrastructure.csproj
      - name: Wygenerowanie migracji
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations add Etap2 \
            -p src/Marshal.Infrastructure \
            -s src/Marshal.Infrastructure \
            -o Data/Migrations
      - name: Wypisanie migracji
        run: |
          echo "@@@@@ MIGRACJA"
          cat src/Marshal.Infrastructure/Data/Migrations/*_Etap2.cs
          echo "@@@@@ MIGAWKA"
          cat src/Marshal.Infrastructure/Data/Migrations/MarshalDbContextModelSnapshot.cs
          echo "@@@@@ KONIEC"
