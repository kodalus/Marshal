name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  rdzen:
    name: Rdzeń — budowanie i testy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wzorce .gitignore
        run: ./tools/check-gitignore.sh

      - name: Cudzysłowy w napisach
        run: ./tools/check-quotes.sh

      - name: Aliasy przestrzeni nazw w XAML-u
        run: ./tools/check-aliases.sh

      - name: XAML jest poprawnym XML-em
        run: ./tools/check-xaml.sh

      - name: Ikony zgodne ze swoim źródłem
        run: ./tools/check-icons.sh

      - name: Odtworzenie pakietów
        run: |
          dotnet restore src/Marshal.Desktop/Marshal.Desktop.csproj
          dotnet restore tests/Marshal.Tests/Marshal.Tests.csproj

      - name: Budowanie
        run: |
          dotnet build src/Marshal.Desktop/Marshal.Desktop.csproj -c Release --no-restore
          dotnet build tests/Marshal.Tests/Marshal.Tests.csproj -c Release --no-restore

      - name: Testy
        run: dotnet test tests/Marshal.Tests/Marshal.Tests.csproj -c Release --no-build --logger "trx;LogFileName=wyniki.trx" --results-directory artefakty/testy

      - name: Migracje zgodne z modelem
        run: |
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes \
            -p src/Marshal.Infrastructure \
            -s src/Marshal.Infrastructure

      # Model bazy budowany przy starcie z odbicia typów kosztuje na telefonie 1,6 s
      # przy **każdym** uruchomieniu (dziennik, wpis „Start: przygotowanie"). Skompilowany
      # z góry kosztuje tyle, ile jego wczytanie. Generowany tutaj, bo wymaga narzędzi EF
      # i SDK.
      #
      # **W repozytorium go teraz nie ma**: na telefonie aplikacja wisiała na nim przy
      # starcie. Jego statyczny konstruktor uruchamia wątek ze stosem 10 MB i czeka na
      # niego, a konstruktor statyczny, który nie wróci, zatrzymuje bez wyjątku każdego,
      # kto dotknie tej klasy. Generowanie zostaje, żeby dało się wrócić jednym commitem,
      # gdy będzie wiadomo, jak go tam uruchomić.
      #
      # Kasowany przed wygenerowaniem, żeby porównanie niżej widziało także plik, który
      # przestał być potrzebny — nie tylko zmieniony.
      - name: Model skompilowany — wygenerowanie
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          rm -rf src/Marshal.Infrastructure/Data/Compiled
          dotnet ef dbcontext optimize \
            -p src/Marshal.Infrastructure \
            -s src/Marshal.Infrastructure \
            -o Data/Compiled \
            -n Marshal.Infrastructure.Data.Compiled

      # Skompilowany model, który rozjechał się z encjami, jest **groźniejszy niż jego
      # brak**: EF przestaje budować model z kodu, więc zmiana pola, której nikt nie
      # przegenerował, przestaje istnieć dla bazy — i widać to dopiero po danych.
      # Stąd ten krok jest zaporą, a nie ozdobą: świeżo wygenerowany musi być co do
      # znaku taki sam jak ten w repozytorium.
      - name: Model skompilowany zgodny z encjami
        run: |
          # Identyfikator modelu jest losowany przy każdym generowaniu i nie niesie nic
          # poza tożsamością wpisu w pamięci podręcznej EF. Bez tej linijki porównanie
          # zapalałoby się **zawsze**, czyli przestałoby cokolwiek znaczyć. Przepisujemy
          # go więc na ten z repozytorium i porównujemy całą resztę.
          builder=src/Marshal.Infrastructure/Data/Compiled/MarshalDbContextModelBuilder.cs

          # Model bywa wyłączony — wtedy nie ma z czym porównywać. Zob. komentarz przy
          # jego generowaniu: na Androidzie wisiał na starcie i leży poza repozytorium,
          # dopóki to się nie rozstrzygnie.
          if ! git ls-tree -r HEAD --name-only -- "$builder" | grep -q .; then
            echo "Skompilowany model nie jest w repozytorium — porównanie pominięte."
            exit 0
          fi

          poprzedni=$(git show "HEAD:$builder" | grep -oP 'modelId: new Guid\("\K[^"]+' || true)

          if [ -n "$poprzedni" ]; then
            sed -i "s/modelId: new Guid(\"[^\"]*\")/modelId: new Guid(\"$poprzedni\")/" "$builder"
          fi

          if ! git diff --exit-code -- src/Marshal.Infrastructure/Data/Compiled; then
            echo "::error::Skompilowany model rozjechał się z encjami. Świeżo wygenerowany leży na gałęzi model-wygenerowany — wciągnij go do main."
            exit 1
          fi

      # Wynik odkładany na osobną gałąź, a nie tylko jako artefakt: artefakty GitHub
      # wydaje spod adresu, którego pośrednik sieciowy tej sesji nie przepuszcza,
      # a gałąź pobiera się zwykłym gitem. Gałąź jest tylko skrzynką na wynik —
      # do „main" wciąga go człowiek, osobnym commitem.
      #
      # Przebieg tego pliku rusza wyłącznie przy zmianach w „main", więc zapis tutaj
      # nie zapętla CI.
      # „always", bo najbardziej potrzebna jest wtedy, gdy porównanie wyżej się zapaliło:
      # wtedy właśnie trzeba mieć skąd wziąć świeży model.
      - name: Model skompilowany — na gałąź
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan model-wygenerowany
          git rm -rf --cached . > /dev/null
          git add -f src/Marshal.Infrastructure/Data/Compiled
          git commit -m "Model skompilowany z $GITHUB_SHA"
          git push -f origin model-wygenerowany

      - name: Model skompilowany — do pobrania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-skompilowany
          path: src/Marshal.Infrastructure/Data/Compiled
          if-no-files-found: ignore

      - name: Wyniki testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyniki-testow
          path: artefakty/testy
          if-no-files-found: ignore

  android:
    name: Android — budowanie
    runs-on: ubuntu-latest

    # Zapis do wydań, żeby APK dał się pobrać wprost na telefon. Reszta przebiegu
    # niczego nie zapisuje, więc uprawnienie jest tu wąskie z rozmysłu.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Workload Androida
        run: dotnet workload install android

      # Podpis stałym kluczem, jeśli jest w sekretach repozytorium.
      #
      # Bez niego każdy przebieg podpisuje APK **świeżym kluczem domyślnym**, bo
      # bieżnia CI startuje za każdym razem od zera. Android nie pozwala nadpisać
      # aplikacji pakietem o innym podpisie i odmawia komunikatem „konflikt
      # z istniejącym pakietem" — czyli każda aktualizacja wymaga odinstalowania,
      # a to kasuje bazę.
      #
      # Klucz nie może leżeć w repozytorium, bo jest publiczne, a kto ma klucz, ten
      # może wypuścić aktualizację Marshala dla każdego, kto go ma. Sekrety są tu
      # jedynym sensownym miejscem. Instrukcja: docs/android-podpis.md.
      - name: Klucz podpisujący
        id: klucz
        env:
          SKARBIEC: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$SKARBIEC" ]; then
            echo "$SKARBIEC" | base64 -d > "$RUNNER_TEMP/marshal.keystore"
            echo "jest=tak" >> "$GITHUB_OUTPUT"
          else
            echo "jest=nie" >> "$GITHUB_OUTPUT"
            echo "::warning::Brak sekretu ANDROID_KEYSTORE — APK podpisany kluczem domyślnym, więc nie nadpisze poprzedniej instalacji."
          fi

      - name: Publikacja APK (klucz stały)
        if: steps.klucz.outputs.jest == 'tak'
        env:
          HASLO: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dotnet publish src/Marshal.Android/Marshal.Android.csproj -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/marshal.keystore" \
            -p:AndroidSigningStorePass="$HASLO" \
            -p:AndroidSigningKeyAlias=marshal \
            -p:AndroidSigningKeyPass="$HASLO"

      - name: Publikacja APK (klucz domyślny)
        if: steps.klucz.outputs.jest != 'tak'
        run: dotnet publish src/Marshal.Android/Marshal.Android.csproj -c Release

      # Jeden plik, nie wszystko, co się znajdzie.
      #
      # Publikacja zostawia obok siebie pakiet podpisany i niepodpisany. Kopiowanie
      # wszystkiego dawało dwa pliki w archiwum — czyli pytanie „który zainstalować"
      # zadane komuś, kto nie ma jak na nie odpowiedzieć — a przy liczeniu sumy
      # kontrolnej dwie linijki zamiast jednej i zerwany przebieg.
      #
      # Nazwa stała, bo adres pobrania z wydania ma się nie zmieniać między budowaniami.
      - name: Zebranie pakietu
        run: |
          mkdir -p artefakty/apk

          PAKIET=$(find src/Marshal.Android/bin/Release -name '*-Signed.apk' | head -n 1)

          if [ -z "$PAKIET" ]; then
            ILE=$(find src/Marshal.Android/bin/Release -name '*.apk' | wc -l)

            if [ "$ILE" != "1" ]; then
              echo "::error::Nie da się wskazać pakietu — znalezionych APK: $ILE."
              find src/Marshal.Android/bin/Release -name '*.apk'
              exit 1
            fi

            PAKIET=$(find src/Marshal.Android/bin/Release -name '*.apk')
          fi

          cp "$PAKIET" artefakty/apk/marshal.apk
          ls -l artefakty/apk

      # Suma kontrolna w dzienniku przebiegu. Po to, żeby dało się sprawdzić, czy plik,
      # który doszedł na telefon, jest tym, który tu powstał — a nie żeby uspokajać.
      # To jedyna rzecz, którą da się o pliku stwierdzić z zewnątrz bez zaufania komukolwiek.
      - name: Suma kontrolna
        id: suma
        run: |
          SUMA=$(sha256sum artefakty/apk/marshal.apk | awk '{print $1}')
          echo "sha=$SUMA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SUMA"

      - name: APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: marshal-apk
          path: artefakty/apk
          if-no-files-found: error

      # Drugie miejsce na ten sam plik, i to ono jest właściwą drogą na telefon.
      #
      # Artefakt przebiegu przychodzi **zapakowany w ZIP i tylko po zalogowaniu**, więc
      # trzeba go pobrać na komputerze i przełożyć. Windows widzi wtedy świeżo zbudowany,
      # nigdy wcześniej niewidziany plik wykonywalny w archiwum i blokuje go po reputacji,
      # a nie po zawartości — komunikatem o wirusie, którego nikt nie znalazł.
      #
      # Wydanie to pojedynczy plik pod stałym adresem, bez logowania i bez archiwum.
      # Telefon pobiera go sam i Windows nie ma w tym żadnego udziału.
      #
      # Ruchoma etykieta „najnowsza": nie wersjonujemy jeszcze wydań, a dwadzieścia wydań
      # dziennie byłoby listą, z której nic nie wynika. Numer wersji w opisie mówi, z czego
      # powstało.
      - name: Wydanie do pobrania
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMA: ${{ steps.suma.outputs.sha }}
        run: |
          OPIS=$(printf 'Budowanie z %s\n\nSHA-256: `%s`\n\nPlik pobrany na telefon powinien mieć tę samą sumę.' "$GITHUB_SHA" "$SUMA")

          if gh release view najnowsza >/dev/null 2>&1; then
            gh release upload najnowsza artefakty/apk/marshal.apk --clobber
            gh release edit najnowsza --notes "$OPIS"
          else
            gh release create najnowsza artefakty/apk/marshal.apk \
              --title "Marshal — najnowsze budowanie" \
              --notes "$OPIS"
          fi

  # Wersja na Windows — samodzielna, czyli razem ze środowiskiem uruchomieniowym.
  #
  # Bez tego instalacja na komputerze znaczyła „zainstaluj SDK i zbuduj sobie sam",
  # a to nie jest instrukcja dla kogoś, kto chce po prostu używać aplikacji. Cena to
  # kilkadziesiąt megabajtów w archiwum; zysk — brak warunków wstępnych.
  #
  # Budowane na Windows, nie krzyżowo z Linuksa: Avalonia ciągnie natywne części
  # zależne od platformy, a przy budowaniu krzyżowym wychodzi to dopiero przy
  # uruchomieniu u kogoś.
  windows:
    name: Windows — wydanie
    runs-on: windows-latest
    needs: rdzen

    # Zapis do wydań, tak samo jak przy APK. Bez tego żeton przebiegu jest tylko do
    # odczytu: `gh release view` przechodzi, `gh release upload` dostaje odmowę —
    # więc pada nie budowanie, tylko ostatni krok, i wygląda to na kłopot z wydaniem.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publikacja
        shell: bash
        run: |
          dotnet publish src/Marshal.Desktop/Marshal.Desktop.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=false \
            -o artefakty/windows/Marshal

      - name: Archiwum
        shell: bash
        run: |
          cd artefakty/windows
          7z a -tzip ../marshal-windows.zip Marshal
          cd ../..
          ls -l artefakty

      - name: Suma kontrolna
        id: suma
        shell: bash
        run: |
          SUMA=$(sha256sum artefakty/marshal-windows.zip | awk '{print $1}')
          echo "sha=$SUMA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SUMA"

      - name: Paczka do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: marshal-windows
          path: artefakty/marshal-windows.zip
          if-no-files-found: error

      # Do tego samego wydania, co APK. Opis zostaje ten, który ustawiło budowanie
      # Androida — dopisywanie go z dwóch zadań naraz kończyłoby się tym, że wygrywa
      # to, które akurat było drugie.
      - name: Wydanie do pobrania
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            if gh release view najnowsza >/dev/null 2>&1; then
              gh release upload najnowsza artefakty/marshal-windows.zip --clobber

              # Suma dopisywana do opisu, nie nadpisująca go: opis stawia budowanie
              # Androida i jest w nim suma APK. Dwa zadania piszące własny opis
              # znaczyłyby, że w wydaniu widać sumę tego pliku, którego zadanie
              # skończyło później — czyli losowego.
              OPIS=$(gh release view najnowsza --json body -q .body)

              if ! printf '%s' "$OPIS" | grep -q 'marshal-windows.zip'; then
                gh release edit najnowsza --notes "$(printf '%s\n\nSHA-256 `marshal-windows.zip`: `%s`' "$OPIS" "${{ steps.suma.outputs.sha }}")"
              fi

              exit 0
            fi

            echo "Wydanie jeszcze nie istnieje — czekam na budowanie Androida ($i)."
            sleep 30
          done

          echo "::error::Wydanie nie powstało — nie ma dokąd wgrać paczki Windows."
          exit 1
